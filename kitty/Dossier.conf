# Dossier for kitty, part of cosmic-dossier-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Dossier.conf

foreground              #242424
background              #C7C7C0
selection_foreground    none
selection_background    #ACACA6

cursor                  #DE6A41
cursor_text_color       #C7C7C0

url_color               #43432B
url_style               curly

active_border_color     #953B19
inactive_border_color   #ACACA6
bell_border_color       #754E3E

active_tab_foreground   #D0D0C8
active_tab_background   #953B19
inactive_tab_foreground #555349
inactive_tab_background #DCDCD4
tab_bar_background      #C7C7C0

mark1_foreground        #C7C7C0
mark1_background        #51573B
mark2_foreground        #C7C7C0
mark2_background        #43432B
mark3_foreground        #C7C7C0
mark3_background        #754E3E

