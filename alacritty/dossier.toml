# Dossier for Alacritty, part of cosmic-dossier-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/dossier.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#C7C7C0"
foreground = "#242424"
bright_foreground = "#151515"
dim_foreground = "#59574D"

[colors.cursor]
text = "#C7C7C0"
cursor = "#DE6A41"

[colors.vi_mode_cursor]
text = "#C7C7C0"
cursor = "#754E3E"

[colors.selection]
text = "CellForeground"
background = "#ACACA6"

[colors.search.matches]
foreground = "#C7C7C0"
background = "#43432B"

[colors.search.focused_match]
foreground = "#D0D0C8"
background = "#953B19"

[colors.hints.start]
foreground = "#C7C7C0"
background = "#754E3E"

[colors.hints.end]
foreground = "#C7C7C0"
background = "#43432B"

[colors.footer_bar]
foreground = "#242424"
background = "#DCDCD4"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#2E3125"
red     = "#A80026"
green   = "#51573B"
yellow  = "#953B19"
blue    = "#43432B"
magenta = "#754E3E"
cyan    = "#6B1F2F"
white   = "#59574D"

[colors.bright]
black   = "#383835"
red     = "#DB0030"
green   = "#2E3125"
yellow  = "#DE6A41"
blue    = "#3E3D31"
magenta = "#5A3A2E"
cyan    = "#4F1622"
white   = "#6B7360"

[colors.dim]
black   = "#45443D"
red     = "#B84A5E"
green   = "#7A7F66"
yellow  = "#B0714F"
blue    = "#6E6E58"
magenta = "#96786A"
cyan    = "#8E5A64"
white   = "#7C7A70"
