# Dossier colour scheme for qt5ct / qt6ct, part of cosmic-dossier-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Dossier, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#242424, #dcdcd4, #dcdcd4, #acaca6, #bbbbb4, #e4e4dc, #242424, #151515, #242424, #e4e4dc, #d0d0c8, #bbbbb4, #953b19, #d0d0c8, #8e3818, #8e3818, #dcdcd4, #d0d0c8, #dcdcd4, #242424, #59574d
disabled_colors=#6b7360, #dcdcd4, #dcdcd4, #acaca6, #bbbbb4, #e4e4dc, #6b7360, #555349, #6b7360, #d0d0c8, #d0d0c8, #bbbbb4, #acaca6, #555349, #59574d, #59574d, #dcdcd4, #d0d0c8, #dcdcd4, #242424, #acaca6
inactive_colors=#242424, #dcdcd4, #dcdcd4, #acaca6, #bbbbb4, #e4e4dc, #242424, #151515, #242424, #e4e4dc, #d0d0c8, #bbbbb4, #953b19, #d0d0c8, #8e3818, #8e3818, #dcdcd4, #d0d0c8, #dcdcd4, #242424, #59574d
