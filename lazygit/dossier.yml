# Dossier for lazygit, part of cosmic-dossier-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/dossier.yml and
# zsh/dossier.zsh sets LG_CONFIG_FILE to "config.yml,dossier.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/dossier.yml"
gui:
  theme:
    activeBorderColor:
      - "#953B19"
      - bold
    inactiveBorderColor:
      - "#ACACA6"
    searchingActiveBorderColor:
      - "#754E3E"
      - bold
    optionsTextColor:
      - "#555349"
    selectedLineBgColor:
      - "#BBBBB4"
    inactiveViewSelectedLineBgColor:
      - "#D0D0C8"
    cherryPickedCommitFgColor:
      - "#C7C7C0"
    cherryPickedCommitBgColor:
      - "#43432B"
    markedBaseCommitFgColor:
      - "#C7C7C0"
    markedBaseCommitBgColor:
      - "#51573B"
    unstagedChangesColor:
      - "#A80026"
    defaultFgColor:
      - "#242424"
  authorColors:
    "*": "#43432B"
